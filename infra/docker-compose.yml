version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidbrief}
      POSTGRES_USER: ${POSTGRES_USER:-bidbrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miniosecret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./services/api
    env_file:
      - ./.env
      - ./services/api/.env
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./services/worker
    env_file:
      - ./.env
      - ./services/worker/.env
    depends_on:
      - db
      - redis
      - minio

  web:
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
  minio_data: